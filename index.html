<style>

    --amber:#ffb000; --amber-dim:#8a5c00; --amber-bright:#ffd27a;

  .term.idle{color:var(--amber-bright);}
  input[type=text]{
    width:100%; background:#120c06; border:1px solid var(--amber); color:var(--amber-bright);
    font-family:'Share Tech Mono',monospace; padding:10px; font-size:13px; margin-top:10px;
  }
  .row2{display:flex; gap:8px; margin-top:8px;}
  button{
    font-family:'Share Tech Mono',monospace; background:transparent; color:var(--amber);

  button:active{background:var(--amber); color:#0a0704;}
  button.ghost{color:var(--amber-dim); border-color:var(--amber-dim);}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; font-size:10px;}

<script>
/* ============ FIREBASE CONFIG — fill in for real persistence ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBFT5---19ShX8Vwrgc90uoMtnOWBEB1Ro",

};
let useFirebase=false, db=null, uid='owner';
async function initBackend(){
  if(firebaseConfig.apiKey){
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.database(); useFirebase=true;
    }catch(e){ console.warn('Firebase init failed, using local storage', e); }
  }
  if(!useFirebase){
    uid = 'owner'; // same fixed key locally too, kept for consistency
  }
}
function localGet(p,def){ try{ const r=localStorage.getItem('tva_'+p); return r?JSON.parse(r):def; }catch(e){ return def; } }
function localSet(p,v){ localStorage.setItem('tva_'+p, JSON.stringify(v)); }
async function dbGet(p,def){ if(useFirebase){ const s=await db.ref('pets/'+uid+'/'+p).once('value'); return s.exists()?s.val():def; } return localGet(p,def); }
async function dbSet(p,v){ if(useFirebase){ await db.ref('pets/'+uid+'/'+p).set(v); } else localSet(p,v); }
async function dbPush(p,v){
  if(useFirebase){ const r=db.ref('pets/'+uid+'/'+p).push(); await r.set(v); return r.key; }
  const key='f'+Date.now()+Math.floor(Math.random()*999); const all=localGet(p,{}); all[key]=v; localSet(p,all); return key;
}
async function dbUpdate(p,v){
  if(useFirebase){ await db.ref('pets/'+uid+'/'+p).update(v); }
  else{ const parts=p.split('/'); const key=parts.pop(); const parent=parts.join('/'); const all=localGet(parent,{}); all[key]=Object.assign(all[key]||{},v); localSet(parent,all); }
}

/* ============ TYPEWRITER ============ */
function typeText(el, text, speed){
  speed = speed || 28;
  el.textContent = '';
  return new Promise((resolve)=>{
    let i = 0;
    const iv = setInterval(()=>{
      el.textContent += text[i];
      i++;
      if(i >= text.length){ clearInterval(iv); resolve(); }
    }, speed);
  });
}

/* ============ TUNABLE RATES (minutes per 1 point of passive drain) ============ */
const HUNGER_RATE = 8;
const HAPPY_RATE = 25;
const ENERGY_RATE = 64;
const DISC_RATE = 40;
const NAP_MINUTES = 30;
const STAGE_RANGES = { infant:[80,90], juvenile:[70,80], adult:[60,70] };
function stageFor(ageDays){ return ageDays<30?'infant': ageDays<90?'juvenile':'adult'; }
function rollThreshold(stage){ const [lo,hi]=STAGE_RANGES[stage]; return Math.round(lo+Math.random()*(hi-lo)); }
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function dateStr(ts){ return new Date(ts).toDateString(); }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }

/* ============ QUESTION BANK ============ */
const QUESTION_BANK = [
  {domain:'existence', q:"If you could remember only one day of your life forever, which would you keep?"},
  {domain:'existence', q:"Do you think you're the same person you were five years ago?"},
  {domain:'preference', q:"What's something you used to hate that you love now?"},
  {domain:'preference', q:"Silence or noise — which unsettles you more?"},
  {domain:'science', q:"If you understood one unsolved scientific mystery perfectly, which would you pick?"},
  {domain:'science', q:"Do you think there's intelligent life elsewhere?"},
  {domain:'art', q:"What's a piece of art, music, or writing that changed how you see things?"},
  {domain:'art', q:"Do you create things, or mostly consume what others create?"},
  {domain:'philosophy', q:"Is a decision still yours if you were nudged into making it?"},
  {domain:'philosophy', q:"What do you think happens after you die?"},
  {domain:'everyday', q:"What does your ideal ordinary Tuesday look like?"},
  {domain:'everyday', q:"What's a small thing that reliably puts you in a bad mood?"},
  {domain:'memory', q:"What's the earliest memory you're fairly sure is real, not imagined?"},
  {domain:'memory', q:"Is there a smell that instantly takes you somewhere else?"},
  {domain:'relationships', q:"Do you find it easy to trust people, or does it take a long time?"},
  {domain:'relationships', q:"Who taught you the most without meaning to?"},
  {domain:'hypothetical', q:"If you had to leave everything behind and start over somewhere new, would you?"},
  {domain:'hypothetical', q:"Would you want to know the exact date you'll die?"},
  {domain:'work', q:"Do you work to live, or live to work, honestly?"},
  {domain:'work', q:"What's something you're good at that nobody asked you to be good at?"},
  {domain:'fear', q:"What's something you were scared of as a kid that still lingers a little?"},
  {domain:'fear', q:"Do you fear being forgotten, or being misunderstood, more?"},
  {domain:'identity', q:"If a stranger described you after one conversation, what would they get wrong?"},
  {domain:'identity', q:"What's a belief you hold that most people around you don't?"}
];
function pickUnaskedQuestion(asked){
  const pool = QUESTION_BANK.filter(q=>!asked.includes(q.q));
  const src = pool.length?pool:QUESTION_BANK;
  return src[Math.floor(Math.random()*src.length)];
}
const IDLE_LINES = ["No questions tonight. Just staying close by.","Some sessions don't need words.","Recalibrating quietly. You don't need to do anything.","Just watching the readout with you."];
const REACTIONS = ["Ohh.","I see.","Hmm.","Interesting.","Noted.","...huh.","Understood."];

async function askBrain(currentMeta, currentFacts){
  const active = Object.values(currentFacts).filter(f=>f.status!=='superseded');
  const ageDays = Math.floor((Date.now()-currentMeta.born)/86400000);
  const asked = active.map(f=>f.question);
  const canFollowUp = ageDays>=21 && active.length>=20;
  const roll = Math.random();
  if(canFollowUp && roll<0.25 && active.length){
    const past = active[Math.floor(Math.random()*active.length)];
    return {type:'followup', text:`Earlier you told me: "${past.answer}" — about ${past.question.toLowerCase()} Does that still hold?`, refFactId:past.id};
  }
  if(roll<0.18) return {type:'idle', text:IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)]};
  const q = pickUnaskedQuestion(asked);
  return {type:'question', text:q.q, domain:q.domain};
}

/* ============ ANIMATED APPEARANCE (frame sets) ============
   Drop your transparent PNG frames into a folder next to this HTML file in
   your GitHub repo (e.g. "appearance/"), then list the filenames below.
   - 1 filename in an array  = static image for that state
   - 2+ filenames in an array = they cycle on a loop (simple flip animation)
   - Leave an array empty []  = falls back automatically to the glow glyph
   State picked each tick:
     sleep = unit is asleep/napping
     low   = hunger or energy below 30
     happy = everything else
*/
const FRAME_SETS = {
  happy: ['1.png','2.png','3.png','2.png','4.png','5.png','6.png','5.png','1.png'],
  sleep: ['s1.png','s2.png','s3.png','s2.png','s1.png'],
  low:   ['l1.png','l1.png','l1.png','l2.png','l3.png','l2.png','l1.png',]
};
const FRAME_MS = 450; // ms between frames of the same set
let frameTimer = null, frameState = null, frameIdx = 0;

function hasFrameSets(){ return Object.values(FRAME_SETS).some(a=>a.length); }
function currentAppearanceState(){
  if(isSleepingNow()) return 'sleep';
  if(vitals.hunger < 30 || vitals.energy < 30) return 'low';
  return 'happy';
}
function showCustomImg(src){
  const img = document.getElementById('customImg');
  const svg = document.getElementById('glyph');
  img.onerror = ()=>{ // missing/renamed file — fall back to the glyph instead of a broken image
    img.classList.add('hidden');
    svg.classList.remove('hidden');
    drawGlyph();
  };
  img.onload = ()=>{
    img.classList.remove('hidden');
    svg.classList.add('hidden');
  };
  img.src = src;
}
function refreshFrame(){
  const state = currentAppearanceState();
  const frames = FRAME_SETS[state] || [];
  if(!frames.length){
    // nothing configured for this state — show the glyph instead
    document.getElementById('customImg').classList.add('hidden');
    document.getElementById('glyph').classList.remove('hidden');
    drawGlyph();
    return;
  }
  if(state !== frameState){ frameState = state; frameIdx = 0; }
  showCustomImg(frames[frameIdx]);
}
function startFrameLoop(){
  clearInterval(frameTimer);
  refreshFrame();
  frameTimer = setInterval(()=>{
    const frames = FRAME_SETS[currentAppearanceState()] || [];
    if(frames.length < 2){ refreshFrame(); return; } // static or empty — just re-check state
    frameIdx = (frameIdx+1) % frames.length;
    showCustomImg(frames[frameIdx]);
  }, FRAME_MS);
}

/* ============ STATE ============ */
let meta, facts={}, vitals, sleep, games, appearance;
let pendingBrainResult=null;
let chessGame=null, chessDepth=1, selectedSq=null;

async function boot(){
  await initBackend();
  meta = await dbGet('meta', null);
  if(!meta){ meta = {name:'UNIT-'+String(Math.floor(Math.random()*900+100)), born:Date.now(), sessionCount:0, lastSession:0}; await dbSet('meta', meta); }
  facts = await dbGet('facts', {});
  vitals = await dbGet('vitals', null);
  if(!vitals){ vitals = {hunger:80, happiness:80, energy:90, discipline:60}; await dbSet('vitals', vitals); }
  if(vitals.discipline===undefined) vitals.discipline = 60;

  sleep = await dbGet('sleep', null);
  if(!sleep){ sleep = {date:null, minutesToday:0, energyBaseline:null, thresholdToday:null, napEnd:0, lastUpdate:Date.now()}; }
  if(!sleep.lastUpdate) sleep.lastUpdate = Date.now();
  games = await dbGet('games', null);
  if(!games){ games = {date:null, playedToday:0}; }
  appearance = await dbGet('appearance', {useCustom:false, dataUrl:null});

  ensureDailyRoll(Date.now());
  simulateSince(sleep.lastUpdate, Date.now());
  sleep.lastUpdate = Date.now();
  await Promise.all([dbSet('vitals', vitals), dbSet('sleep', sleep), dbSet('games', games)]);

  meta.sessionCount = (meta.sessionCount||0)+1;
  meta.lastSession = Date.now();
  await dbSet('meta', meta);

  renderHeader(); renderVitals(); renderMemLog(); renderAppearance();
  updateSleepUI();

  document.getElementById('termText').textContent = '';
  if(!isSleepingNow()){
    const result = await askBrain(meta, facts);
    pendingBrainResult = result;
    if(result.type !== 'idle'){
      const alreadyWaiting = Math.random() < 0.3; // some days it's already got something queued
      const reveal = async ()=>{
        document.getElementById('termText').classList.toggle('idle', false);
        document.getElementById('answerBox').classList.remove('hidden');
        await typeText(document.getElementById('termText'), result.text);
      };
      if(alreadyWaiting) reveal();
      else setTimeout(reveal, 2500 + Math.random()*5500);
    }
    // idle sessions: stay completely silent, no text at all
  }
  // asleep: status line already shows SLEEPING / NIGHT CYCLE — no extra text needed

  setInterval(tick, 30000);
}

function ensureDailyRoll(ts){
  const ds = dateStr(ts);
  if(sleep.date !== ds){
    sleep.date = ds;
    sleep.minutesToday = 0;
    sleep.energyBaseline = null;
    const ageDays = Math.floor((ts-meta.born)/86400000);
    sleep.thresholdToday = rollThreshold(stageFor(ageDays));
  }
  if(games.date !== ds){ games.date = ds; games.playedToday = 0; }
}

function isMandatoryNight(ts){ return new Date(ts).getHours() < 8; }
function isNapping(ts){ return sleep.napEnd && ts < sleep.napEnd; }
function isSleepingNow(){ const now=Date.now(); return isMandatoryNight(now) || isNapping(now); }

function simulateSince(from, to){
  let cursor = from;
  let guard = 0;
  while(cursor < to && guard < 300){
    guard++;
    ensureDailyRoll(cursor);
    const dayStart = startOfDay(cursor);
    const nightEnd = dayStart + 8*3600*1000;
    const nextMidnight = dayStart + 24*3600*1000;
    let segEnd, asleep;
    if(cursor < nightEnd){ segEnd = Math.min(to, nightEnd); asleep = true; }
    else if(isNapping(cursor)){ segEnd = Math.min(to, sleep.napEnd); asleep = true; }
    else {
      let bound = Math.min(to, nextMidnight);
      if(sleep.napEnd && sleep.napEnd > cursor && sleep.napEnd < bound) bound = sleep.napEnd;
      segEnd = bound; asleep = false;
    }
    const minutes = (segEnd - cursor)/60000;
    if(minutes>0){ if(asleep) applySleepMinutes(minutes); else applyAwakeMinutes(minutes); }
    if(segEnd<=cursor) { cursor = to; break; }
    cursor = segEnd;
  }
}
function applySleepMinutes(min){
  if(sleep.energyBaseline===null) sleep.energyBaseline = vitals.energy;
  sleep.minutesToday = Math.min(720, sleep.minutesToday + min);
  const recovered = (100 - sleep.energyBaseline) * (sleep.minutesToday/720);
  vitals.energy = clamp(sleep.energyBaseline + recovered);
}
function applyAwakeMinutes(min){
  vitals.hunger = clamp(vitals.hunger - min/HUNGER_RATE);
  vitals.happiness = clamp(vitals.happiness - min/HAPPY_RATE);
  vitals.energy = clamp(vitals.energy - min/ENERGY_RATE);
  vitals.discipline = clamp(vitals.discipline - min/DISC_RATE);
}

async function tick(){
  const now = Date.now();
  simulateSince(sleep.lastUpdate, now);
  sleep.lastUpdate = now;
  if(sleep.napEnd && now >= sleep.napEnd) sleep.napEnd = 0;
  await Promise.all([dbSet('vitals', vitals), dbSet('sleep', sleep)]);
  renderVitals(); renderHeader(); updateSleepUI();
}

/* ============ RENDER ============ */
function renderHeader(){
  document.getElementById('petName').textContent = meta.name;
  const ageDays = Math.floor((Date.now()-meta.born)/86400000);
  document.getElementById('metaTag').textContent = `AGE ${String(ageDays).padStart(2,'0')}D · S${String(meta.sessionCount).padStart(2,'0')}`;
}
function renderVitals(){
  document.getElementById('s_hunger').textContent = Math.round(vitals.hunger);
  document.getElementById('s_happiness').textContent = Math.round(vitals.happiness);
  document.getElementById('s_energy').textContent = Math.round(vitals.energy);
  document.getElementById('s_discipline').textContent = Math.round(vitals.discipline);
}
function renderMemLog(){
  const el = document.getElementById('memlog'); el.innerHTML='';
  const entries = Object.entries(facts).sort((a,b)=>b[1].ts-a[1].ts);
  if(!entries.length){ el.innerHTML='<div class="item">NO FACTS LOGGED YET</div>'; return; }
  entries.forEach(([id,f])=>{
    const div=document.createElement('div');
    div.className='item'+(f.status==='superseded'?' superseded':'');
    div.innerHTML = `<div class="q">${esc(f.question)}</div><div>${esc(f.answer)}</div><div class="meta">${new Date(f.ts).toLocaleDateString()} ${f.domain?('· '+f.domain):''}${f.status==='superseded'?' · SUPERSEDED':''}</div>`;
    if(f.status!=='superseded') div.onclick = ()=>openCorrect(id,f);
    el.appendChild(div);
  });
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderAppearance(){
  const svg = document.getElementById('glyph');
  const img = document.getElementById('customImg');
  const reset = document.getElementById('resetImg');
  if(hasFrameSets()){
    reset.classList.add('hidden');
    startFrameLoop();
  } else if(appearance.useCustom && appearance.dataUrl){
    clearInterval(frameTimer);
    svg.classList.add('hidden'); img.classList.remove('hidden'); reset.classList.remove('hidden');
    img.src = appearance.dataUrl;
  } else {
    clearInterval(frameTimer);
    svg.classList.remove('hidden'); img.classList.add('hidden'); reset.classList.add('hidden');
    drawGlyph();
  }
}
function drawGlyph(){
  const avg = (vitals.hunger+vitals.happiness+vitals.energy)/3;
  const n=6, cx=100, cy=100, rBase=70;
  const active = Math.round((avg/100)*n);
  let paths='';
  for(let i=0;i<n;i++){
    const a0=(Math.PI*2/n)*i - Math.PI/2, a1=(Math.PI*2/n)*(i+1)-Math.PI/2;
    const r = rBase - i*3;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const on = i<active;
    paths += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${on?'#ffb000':'#3a2a10'}" stroke-width="${on?3:1.5}" opacity="${on?1:0.5}"/>`;
  }
  const coreR = 10 + (avg/100)*14;
  document.getElementById('glyph').innerHTML = `
    <circle cx="100" cy="100" r="${coreR}" fill="#ffb000" opacity="0.85"/>
    <circle cx="100" cy="100" r="${coreR+6}" fill="none" stroke="#8a5c00" stroke-width="1"/>
    ${paths}
    <circle cx="100" cy="100" r="82" fill="none" stroke="#3a2a10" stroke-width="1" stroke-dasharray="2 4"/>`;
}
function updateSleepUI(){
  const label = document.getElementById('glyphLabel');
  const status = document.getElementById('statusLine');
  const sleeping = isSleepingNow();
  document.getElementById('btnFeed').disabled = sleeping;
  document.getElementById('btnPlay').disabled = sleeping;
  status.classList.remove('crit','sleep');
  if(sleeping){
    label.textContent = 'SLEEPING';
    status.textContent = isMandatoryNight(Date.now()) ? 'NIGHT CYCLE // DO NOT DISTURB' : 'NAPPING';
    status.classList.add('sleep');
    if(hasFrameSets()) refreshFrame();
    else if(!appearance.useCustom) drawGlyph();
    return;
  }
  const avg = (vitals.hunger+vitals.happiness+vitals.energy)/3;
  if(avg<25){ label.textContent='CRITICAL'; status.textContent='WARNING // NULL NULL'; status.classList.add('crit'); }
  else if(avg<55){ label.textContent='UNSTABLE'; status.textContent='MONITORING'; }
  else { label.textContent='STABLE'; status.textContent='NULL NULL NULL'; }
  if(hasFrameSets()) refreshFrame();
  else if(!appearance.useCustom) drawGlyph();
}

/* ============ ANSWER / CORRECTION ============ */
async function submitAnswer(){
  const val = document.getElementById('answerInput').value.trim();
  if(!val) return;
  const rec = { question: pendingBrainResult.text, answer: val, domain: pendingBrainResult.domain||'followup', ts: Date.now(), status:'active' };
  const key = await dbPush('facts', rec); facts[key]=rec;
  if(pendingBrainResult.type==='followup' && pendingBrainResult.refFactId){
    await dbUpdate('facts/'+pendingBrainResult.refFactId, {status:'superseded', supersededBy:key});
    if(facts[pendingBrainResult.refFactId]) facts[pendingBrainResult.refFactId].status='superseded';
  }
  vitals.happiness = clamp(vitals.happiness+2);
  await dbSet('vitals', vitals);
  document.getElementById('answerInput').value='';
  document.getElementById('answerBox').classList.add('hidden');
  typeText(document.getElementById('termText'), REACTIONS[Math.floor(Math.random()*REACTIONS.length)]);
  renderMemLog(); renderVitals();
}
function openCorrect(id,f){
  document.getElementById('memPanel').classList.add('hidden');
  document.getElementById('correctPanel').classList.remove('hidden');
  document.getElementById('correctQ').textContent = f.question;
  document.getElementById('correctInput').value = f.answer;
  document.getElementById('correctPanel').dataset.origId = id;
}
async function saveCorrection(){
  const origId = document.getElementById('correctPanel').dataset.origId;
  const orig = facts[origId];
  const newVal = document.getElementById('correctInput').value.trim();
  if(!newVal || !orig) return;
  const rec = {question:orig.question, answer:newVal, domain:orig.domain, ts:Date.now(), status:'active', correctsFactId:origId};
  const key = await dbPush('facts', rec); facts[key]=rec;
  await dbUpdate('facts/'+origId, {status:'superseded', supersededBy:key});
  facts[origId].status='superseded';
  document.getElementById('correctPanel').classList.add('hidden');
  renderMemLog();
}

/* ============ ACTIONS ============ */
document.getElementById('submitAns').onclick = submitAnswer;
document.getElementById('skipAns').onclick = ()=>{
  document.getElementById('answerBox').classList.add('hidden');
  typeText(document.getElementById('termText'), "We'll come back to that.");
};
document.getElementById('btnFeed').onclick = async ()=>{
  if(isSleepingNow()) return;
  await tick();
  vitals.hunger=clamp(vitals.hunger+20); vitals.happiness=clamp(vitals.happiness+3);
  await dbSet('vitals', vitals); renderVitals();
};
document.getElementById('btnMem').onclick = ()=>{ document.getElementById('memPanel').classList.toggle('hidden'); renderMemLog(); };
document.getElementById('cancelCorrect').onclick = ()=>{ document.getElementById('correctPanel').classList.add('hidden'); document.getElementById('memPanel').classList.remove('hidden'); };
document.getElementById('submitCorrect').onclick = saveCorrection;

document.getElementById('btnRest').onclick = async ()=>{
  await tick();
  const t = document.getElementById('termText');
  if(isSleepingNow()){ typeText(t,'Already asleep.'); return; }
  ensureDailyRoll(Date.now());
  if(sleep.minutesToday>=720){ typeText(t,'Fully rested today.'); return; }
  if(vitals.happiness<40){ typeText(t,"Too unhappy to settle down."); return; }
  if(vitals.energy > sleep.thresholdToday+10){ typeText(t,'Not tired yet.'); return; }
  sleep.napEnd = Date.now() + NAP_MINUTES*60000;
  await dbSet('sleep', sleep);
  updateSleepUI();
  typeText(t, 'Taking a nap...');
};

/* ============ CUSTOM PNG APPEARANCE ============ */
document.getElementById('imgBtn').onclick = ()=> document.getElementById('imgFile').click();
document.getElementById('resetImg').onclick = async ()=>{
  appearance = {useCustom:false, dataUrl:null};
  await dbSet('appearance', appearance);
  renderAppearance();
};
document.getElementById('imgFile').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  // No canvas processing — the file's own alpha channel is kept exactly as-is,
  // so a transparent PNG stays transparent (no filled-in square/border).
  const url = await fileToDataUrl(file);
  appearance = {useCustom:true, dataUrl:url};
  await dbSet('appearance', appearance);
  renderAppearance();
};
function fileToDataUrl(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

/* ============ CHESS ============ */
document.getElementById('btnPlay').onclick = ()=>{ if(!isSleepingNow()) startChess(); };
document.getElementById('closeChess').onclick = ()=> document.getElementById('chessPanel').classList.add('hidden');
document.getElementById('playAgainYes').onclick = startChess;
document.getElementById('playAgainNo').onclick = ()=>{ document.getElementById('chessPanel').classList.add('hidden'); };

function startChess(){
  if(typeof Chess === 'undefined'){ alert('Chess engine failed to load — check your connection and reload.'); return; }
  chessGame = new Chess();
  chessDepth = 1 + Math.floor(Math.random()*3);
  selectedSq = null;
  document.getElementById('chessPanel').classList.remove('hidden');
  document.getElementById('playAgainRow').classList.add('hidden');
  document.getElementById('chessStatus').textContent = `NEW GAME — OPPONENT DEPTH ${chessDepth} (assigned randomly this game)`;
  renderBoard();
}
const PIECE_GLYPH = {p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};
function renderBoard(){
  const boardEl = document.getElementById('board'); boardEl.innerHTML='';
  const board = chessGame.board();
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const file='abcdefgh'[c];
      const rank=8-r;
      const sqName=file+rank;
      const piece=board[r][c];
      const div=document.createElement('div');
      div.className='sq '+(((r+c)%2===0)?'light':'dark')+(selectedSq===sqName?' sel':'');
      if(piece){
        const glyph = piece.color==='w'? piece.type.toUpperCase() : piece.type;
        div.textContent = PIECE_GLYPH[glyph];
      }
      div.onclick = ()=>onSquareClick(sqName);
      boardEl.appendChild(div);
    }
  }
}
function onSquareClick(sqName){
  if(chessGame.game_over()) return;
  if(chessGame.turn()!=='w') return;
  if(selectedSq){
    const move = chessGame.move({from:selectedSq, to:sqName, promotion:'q'});
    selectedSq = null;
    if(move){
      renderBoard();
      checkGameOver().then(over=>{ if(!over) setTimeout(engineMove, 350); });
    } else {
      const piece = chessGame.get(sqName);
      selectedSq = (piece && piece.color==='w') ? sqName : null;
      renderBoard();
    }
  } else {
    const piece = chessGame.get(sqName);
    if(piece && piece.color==='w'){ selectedSq=sqName; renderBoard(); }
  }
}
function evalBoard(c){
  const vals={p:1,n:3,b:3,r:5,q:9,k:0};
  let score=0;
  c.board().forEach(row=>row.forEach(sq=>{ if(sq){ const v=vals[sq.type]; score += sq.color==='w'?v:-v; } }));
  return score;
}
function minimax(c, depth, isMax, alpha, beta){
  if(depth===0 || c.game_over()) return evalBoard(c);
  const moves = c.moves();
  if(isMax){
    let best=-Infinity;
    for(const m of moves){ c.move(m); best=Math.max(best, minimax(c,depth-1,false,alpha,beta)); c.undo(); alpha=Math.max(alpha,best); if(beta<=alpha) break; }
    return best;
  } else {
    let best=Infinity;
    for(const m of moves){ c.move(m); best=Math.min(best, minimax(c,depth-1,true,alpha,beta)); c.undo(); beta=Math.min(beta,best); if(beta<=alpha) break; }
    return best;
  }
}
function engineMove(){
  const moves = chessGame.moves();
  if(!moves.length) return;
  let bestMove=null, bestScore=Infinity;
  const shuffled = moves.sort(()=>Math.random()-0.5);
  for(const m of shuffled){
    chessGame.move(m);
    const score = minimax(chessGame, chessDepth-1, true, -Infinity, Infinity);
    chessGame.undo();
    if(score < bestScore){ bestScore=score; bestMove=m; }
  }
  chessGame.move(bestMove);
  renderBoard();
  checkGameOver();
}
async function checkGameOver(){
  if(!chessGame.game_over()) return false;
  let msg='GAME OVER — DRAW';
  let outcome='draw';
  if(chessGame.in_checkmate()){
    if(chessGame.turn()==='w'){ msg='GAME OVER — OPPONENT WINS'; outcome='loss'; }
    else { msg='GAME OVER — YOU WIN'; outcome='win'; }
  }
  document.getElementById('chessStatus').textContent = msg;
  await tick();
  if(outcome==='win'){ vitals.happiness = 80 + Math.floor(Math.random()*21); }
  else { vitals.happiness = clamp(vitals.happiness + 5 + Math.floor(Math.random()*11)); }
  vitals.energy = clamp(vitals.energy - (5+Math.floor(Math.random()*6)));
  vitals.discipline = clamp(vitals.discipline + 1 + Math.floor(Math.random()*4));
  ensureDailyRoll(Date.now());
  games.playedToday += 1;
  await Promise.all([dbSet('vitals', vitals), dbSet('games', games)]);
  renderVitals();
  document.getElementById('playAgainRow').classList.remove('hidden');
  return true;
}

boot();
